<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>安邻 · 社区居家养老服务</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <section id="login-screen" class="entry-screen" aria-labelledby="login-title">
    <header class="entry-header">
      <a class="entry-brand" href="#overview" aria-label="安邻首页"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 14 16 5l11 9M9 12v14h14V12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 23s-5-3-5-6a2.7 2.7 0 0 1 5-1.4 2.7 2.7 0 0 1 5 1.4c0 3-5 6-5 6Z" fill="currentColor"/></svg><span>安邻</span></a>
    </header>
    <div class="entry-layout">
      <div class="entry-column">
        <div class="entry-heading"><h1 id="login-title">照护，就在身边</h1><p>社区居家养老智慧服务平台</p></div>
        <div class="entry-card">
          <form id="login-form">
            <label>账号<input name="username" autocomplete="username" placeholder="请输入账号" required></label>
            <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
            <p id="login-error" class="error" role="alert"></p>
            <button type="submit" class="primary entry-submit">登录工作台</button>
            <details class="entry-demo"><summary>演示账号</summary><div class="entry-demo-content"><p>社区 community01 · 家属 family01<br>护工 worker01 · 机构 agency01<br>街道 street01 · 民政 civil01<br>管理员 admin</p><p>统一密码：<code>Care2026!</code></p></div></details>
          </form>
        </div>
      </div>
      <figure class="entry-visual"><img src="/static/images/care-home-editorial.png" alt="社区服务人员与老人居家交谈" width="1122" height="1402" fetchpriority="high"></figure>
    </div>
  </section>
  <div id="workspace" class="workspace" hidden>
    <header class="sidebar site-header">
      <div class="header-inner">
        <div class="sidebar-brand-row"><a class="sidebar-brand" href="#overview" aria-label="安邻服务总览"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 14 16 5l11 9M9 12v14h14V12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 23s-5-3-5-6a2.7 2.7 0 0 1 5-1.4 2.7 2.7 0 0 1 5 1.4c0 3-5 6-5 6Z" fill="currentColor"/></svg><span>安邻</span></a></div>
        <nav id="navigation" aria-label="主导航"></nav>
        <div class="header-account"><span class="avatar" id="avatar">社</span><span id="user-label"></span><button id="logout" class="secondary">退出</button></div>
        <button type="button" class="mobile-menu-toggle" id="menu-toggle" aria-controls="navigation" aria-expanded="false">菜单<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
      </div>
    </header>
    <div class="workspace-context"><div class="breadcrumb-bar"><a href="#overview">首页</a><span aria-hidden="true">/</span><span id="breadcrumb">服务工作台 / 服务总览</span></div><time id="today"></time></div>
    <main id="main-content" tabindex="-1">
      <div class="page-content">
        <div class="page-heading"><div><p class="eyebrow" id="page-eyebrow">社区服务工作台</p><h1 id="page-title">服务总览</h1><p id="page-description" class="muted">让每一份照护，都有清晰的进展</p></div><div id="page-actions"></div></div>
        <section id="overview-content"></section>
        <section id="list-content" hidden>
          <div class="panel table-panel"><div class="table-toolbar"><h2 id="table-title"></h2><form id="search-form"><div class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" aria-label="搜索列表" placeholder="搜索姓名"></div><button class="primary" type="submit">搜索</button></form></div>
          <div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
          <div class="pagination"><span id="result-count"></span><div><button id="previous" class="secondary">上一页</button><span id="page-number"></span><button id="next" class="secondary">下一页</button></div></div></div>
        </section>
      </div>
    </main>
    <footer class="app-footer"><div><span class="footer-wordmark">安邻</span><span>社区居家养老智慧服务平台</span></div><p>本地课程设计环境 · 业务数据为虚拟测试数据<br><span>服务、工时与资金按记录追溯</span></p></footer>
  </div>
  <dialog id="detail-dialog" class="detail-dialog"><div class="dialog-heading"><div><p class="eyebrow">业务记录</p><h2 id="detail-title"></h2></div><button class="icon-button close-dialog" aria-label="关闭详情">×</button></div><div id="detail-body"></div><div id="detail-actions" class="action-row"></div></dialog>
  <dialog id="form-dialog"><form id="action-form"><div class="dialog-heading"><h2 id="form-title"></h2><button type="button" class="icon-button close-dialog" aria-label="关闭表单">×</button></div><p id="form-description" class="muted"></p><div id="form-fields" class="form-grid"></div><p id="form-error" class="error" role="alert"></p><div class="form-footer"><button type="button" class="secondary close-dialog">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
